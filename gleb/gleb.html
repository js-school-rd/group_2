<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="gleb.css" />
    <script src="gleb.js" defer></script>
  </head>

  <body style="background-color: #032b2e66">
    <section id="main" class="section-main">
      <p class="budget" id="text-budget">6000$</p>
      <div class="create-expence">
        <input type="number" name="Type Amount" id="expence-amount" />
        <div class="list-cat" id="list-categories"></div>
      </div>
      <button id="show-history">SHOW HISTORY</button>
    </section>
    <section id="history" class="section-history">
      <p class="page-title" id="text-history">< History</p>
      <div id="transactions" class="list-transaction"></div>
    </section>
  </body>
</html>
